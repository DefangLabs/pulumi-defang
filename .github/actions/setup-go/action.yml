name: Setup Go build environment
description: Fetches tags, installs Go, and installs pulumictl.

inputs:
  cache:
    description: Whether to restore-and-save the Go cache or restore it only.
    required: false
    default: read-write

runs:
  using: composite
  steps:
    - name: Unshallow clone for tags
      shell: bash
      run: git fetch --prune --unshallow --tags # pulumictl needs tags to compute v2.x version

    - name: Install Go
      id: setup-go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with:
        go-version-file: go.mod
        # Cache explicitly below so releases can fall back to the most recent
        # compatible main-branch cache when their dependency hash changes.
        cache: false

    # setup-go's built-in cache has only an exact dependency-hash key. Retain
    # exact matches, but fall back to the latest cache built with this Go
    # version so a dependency update does not force every package to rebuild.
    # The cache path must be identical in all jobs that share it; the release
    # job bind-mounts its large-disk build cache at Go's normal cache path.
    - name: Restore and save Go cache
      if: inputs.cache == 'read-write'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          ${{ steps.setup-go.outputs.GOMODCACHE }}
          ${{ steps.setup-go.outputs.GOCACHE }}
        key: defang-go-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          defang-go-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-go.outputs.go-version }}-

    - name: Restore Go cache
      if: inputs.cache == 'restore'
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          ${{ steps.setup-go.outputs.GOMODCACHE }}
          ${{ steps.setup-go.outputs.GOCACHE }}
        key: defang-go-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          defang-go-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-go.outputs.go-version }}-

    - name: Install pulumictl
      shell: bash
      run: |
        arch=${{ runner.arch == 'ARM64' && 'arm64' || 'amd64' }}
        tarball="pulumictl-${version}-linux-${arch}.tar.gz"
        checksums="pulumictl_${version#v}_checksums.txt"
        gh release download "${version}" --repo pulumi/pulumictl --pattern "${tarball}" --pattern "${checksums}" --dir /tmp
        echo "${checksums_sha256}  /tmp/${checksums}" | sha256sum -c
        cd /tmp && sha256sum -c --ignore-missing "${checksums}"
        tar -xzf "/tmp/${tarball}" -C /usr/local/bin pulumictl
      env:
        GH_TOKEN: ${{ github.token }}
        # To update: change version and update checksums_sha256 from
        # https://github.com/pulumi/pulumictl/releases (checksums.txt)
        version: v0.0.50
        checksums_sha256: bdd0cbaa7a502c75fd659977e8c519d307dbeadd05c0ebbbecb485a778804009
