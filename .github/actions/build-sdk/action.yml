name: Setup and Build SDK
description: Installs Go, pulumictl, Pulumi CLI, and the language-specific toolchain, then builds the SDK.

inputs:
  language:
    description: SDK language to set up (nodejs, python, dotnet, go)
    required: true
  provider:
    description: Provider to build the SDK for (e.g. defang-aws, defang-gcp, defang-azure)
    required: true

runs:
  using: composite
  steps:
    - name: Setup Go build environment
      uses: ./.github/actions/setup-go

    - name: Install Pulumi CLI
      uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7

    - if: ${{ inputs.language == 'nodejs' }}
      name: Setup Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        # Node 24 ships with npm 11, which supports OIDC Trusted Publishers natively.
        # We upgraded from Node 22 because the Node 22.22.2 tool cache on the ubuntu-24.04
        # runner image ships with a broken npm 10.9.7 (promise-retry missing from its module
        # tree), which causes `npm install -g` to fail. Node 24 avoids this entirely.
        # See: https://github.com/actions/runner-images/issues/13883
        #      https://github.com/nodejs/node/pull/62463
        node-version: 24.x # should match the version in shell.nix
        registry-url: https://registry.npmjs.org

    - if: ${{ inputs.language == 'nodejs' }}
      name: Export placeholder NODE_AUTH_TOKEN
      shell: bash
      # setup-node's registry-url writes an .npmrc with _authToken=${NODE_AUTH_TOKEN}.
      # Up to v6 the action exported a placeholder token so unauthenticated commands
      # (yarn install, OIDC npm publish) could still expand it; v7 removed that
      # (actions/setup-node PR 1558), so we restore it here.
      run: |
        if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
          echo "NODE_AUTH_TOKEN=XXXXX-XXXXX-XXXXX-XXXXX" >> "$GITHUB_ENV"
        fi

    - if: ${{ inputs.language == 'dotnet' }}
      name: Setup DotNet
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
      with:
        dotnet-version: 8.0.x # should match the version in shell.nix

    - if: ${{ inputs.language == 'python' }}
      name: Setup Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: "3.12" # should match the version in shell.nix

    - if: ${{ inputs.language == 'python' }}
      name: Install Python build dependencies
      shell: bash
      run: pip install setuptools

    - name: Build SDK
      shell: bash
      run: make ${{ inputs.language }}_sdk_${{ inputs.provider }}
