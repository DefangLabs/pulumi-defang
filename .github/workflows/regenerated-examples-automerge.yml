name: Auto-merge regenerated examples

# release.yml opens a `chore/regenerate-examples-<tag>` PR after every release and
# tries to merge it, but the org ruleset on main wants one approving review and a
# bot cannot approve its own PR, so the PR sat open until a human clicked Approve.
# This job does that approval as a second identity (RELEASE_PAT) and trusts
# release.yml's own output completely: no check that the diff really is only a
# version bump, no check that the SDK versions it points at are published.

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    name: Approve and merge
    if: >-
      github.event.pull_request.user.login == 'github-actions[bot]' &&
      startsWith(github.event.pull_request.head.ref, 'chore/regenerate-examples-v')
    runs-on: ubuntu-latest
    steps:
      - name: Approve
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::RELEASE_PAT is not set, so this run cannot approve: GITHUB_TOKEN cannot approve a PR authored by github-actions[bot]. Approve $PR_URL by hand and auto-merge will finish it."
            exit 0
          fi
          gh pr review --approve "$PR_URL" --body "Approved by CI: regenerated-examples PRs are trusted to release.yml's own output."

      - name: Merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr merge "$PR_URL" --squash --delete-branch \
            || gh pr merge "$PR_URL" --squash --delete-branch --auto \
            || echo "::warning::Could not merge $PR_URL; merge it manually"
