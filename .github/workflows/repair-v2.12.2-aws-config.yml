name: Repair v2.12.2 AWS image configuration

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  repair:
    runs-on: ubuntu-latest
    environment: publish
    steps:
      - name: Refuse to overwrite a newer release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != refs/heads/main ]; then
            echo '::error::Run the repair from main'
            exit 1
          fi
          latest="$(gh release view --json tagName --jq .tagName)"
          if [ "$latest" != v2.12.2 ]; then
            echo "::error::Latest release is $latest, not v2.12.2; refusing to set an older image"
            exit 1
          fi
          digest="$(docker buildx imagetools inspect public.ecr.aws/defang-io/cd:v2.12.2-aws | awk '$1 == "Digest:" {print $2; exit}')"
          if [ "$digest" != sha256:a3cdcdcf1984a06bb0256e3ce6dc139586333e89a4c352b467788718f5bcf585 ]; then
            echo "::error::Published AWS image digest does not match the release job: $digest"
            exit 1
          fi
      - name: Set the published AWS image digest
        uses: DefangLabs/defang-github-action@981924edd6d4dec17d6ddb03e956174223bcec55 # v2.5.0
        with:
          cli-version: nightly
          project: ecs
          stack: awsprod1oidc
          command: config set -e cd_image_aws_v2
        env:
          cd_image_aws_v2: public.ecr.aws/defang-io/cd@sha256:a3cdcdcf1984a06bb0256e3ce6dc139586333e89a4c352b467788718f5bcf585
