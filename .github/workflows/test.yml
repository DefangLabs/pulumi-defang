name: test
on:
  push:
    branches:
      - main
  pull_request:

env:
  IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/cd

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    concurrency:
      group: test-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Setup Go build environment
        uses: ./.github/actions/setup-go

      - name: Install Pulumi CLI
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0
        with:
          pulumi-version-file: .pulumi.version

      - name: Check README examples are in sync
        run: scripts/check-readme-examples.sh

      - name: Check Dockerfile precaches every plugin a provider imports
        run: scripts/check-dockerfile-plugins.sh

      - run: make provider

      - run: make schema

      - run: COVER=1 make test

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.11.4
          args: --timeout=5m --config=.golangci.yaml ./provider/...

  build_sdks:
    name: Build SDKs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [nodejs, python, dotnet, go]
        provider:
          - aws
          - gcp
          - azure
          - scaleway
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Setup and build SDK
        uses: ./.github/actions/build-sdk
        with:
          language: ${{ matrix.language }}
          provider: defang-${{ matrix.provider }}

      - name: Build Example
        run: make example_${{ matrix.provider }}_${{ matrix.language }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

    # - name: Check clean examples working tree
    #   run: |
    #     git update-index -q --refresh
    #     if ! git diff-index --quiet HEAD -- examples/; then
    #         >&2 echo "error: examples directory is not clean, aborting!"
    #         git status examples/
    #         git diff examples/
    #         exit 1
    #     fi

    # - name: Ensure clean example versions
    #   run: |
    #     if grep -r '+dirty' examples/; then
    #       >&2 echo "error: found +dirty version in examples. Regenerate examples with \`make examples\` and commit the changes."
    #       exit 1
    #     fi

  regen:
    # Regeneration must not push a new PR head after the other checks have
    # started: the required gate must validate the commit being merged.
    # Use the CLI version pinned alongside the proposed merge's SDK.
    name: Regenerate schema and Go SDK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout proposed merge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Setup Go build environment
        uses: ./.github/actions/setup-go
      - name: Install Pulumi CLI
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0
        with:
          pulumi-version-file: .pulumi.version
      - run: make provider schema go_sdk
      - name: Check for generated changes
        run: |
          if ! git diff --exit-code -- provider/cmd/pulumi-resource-defang-*/schema.json sdk/v2/; then
            echo "::error::Schema or Go SDK is out of date; regenerate and commit it."
            exit 1
          fi
          if [ -n "$(git ls-files --others --exclude-standard -- sdk/v2/)" ]; then
            echo "::error::Regeneration created untracked SDK files; commit them."
            exit 1
          fi

  build_image:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs:
      - build_sdks
    environment: defang-staging
    permissions:
      contents: read
      packages: write
      id-token: write # for defang OIDC login
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Setup Go build environment
        uses: ./.github/actions/setup-go
        with:
          # The image builds with CGO_ENABLED=0 and -trimpath, which share no
          # compiled packages with the test job's cache, so keep its own.
          cache-key-prefix: defang-go-image

      # Compile the image's Go binaries here, where setup-go's cache survives
      # between runs; inside BuildKit every run recompiled every cloud SDK.
      # The versions are the Dockerfile's defaults, which this image has
      # always been built with.
      - name: Build the image's Go binaries
        run: make image_binaries CD_VERSION=0.0.1 PROVIDER_VERSION=0.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        # Fork and Dependabot PR tokens cannot write packages; build without pushing.
        if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image repo and tag
        run: |
          echo "IMAGE_REPO=${IMAGE_REPO,,}" >> "$GITHUB_ENV"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "IMAGE_TAG=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_ENV"
          else
            # `make version` emits SemVer, which may include a `+<commit>` build-metadata
            # suffix (e.g. 2.1.2-alpha+a3aefa34). Docker tags disallow `+`, so swap it for `-`.
            VERSION="$(make version)"
            echo "IMAGE_TAG=${VERSION//+/-}" >> "$GITHUB_ENV"
          fi

      - name: Build and push image to GHCR
        id: build-push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: . # build context must be repo root to include generated Go SDK
          push: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}
          target: all
          build-args: BINARIES=prebuilt
          tags: ${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}
          # No layer cache: with the binaries prebuilt, every remaining step is
          # a 10-15s download, while exporting the cache took 1-4 minutes and
          # several GB of the repo's Actions cache quota.

      # Pin the staging Azure CD image ref (digest) in the Defang Fabric. Only on main-branch
      # pushes — PR runs would otherwise have every contributor overwrite the staging config.
      - name: Set cd_image_ configs in Defang
        if: github.event_name == 'push'
        uses: DefangLabs/defang-github-action@981924edd6d4dec17d6ddb03e956174223bcec55 # v2.5.0
        with:
          project: ecs
          stack: awsstagingoidc
          command: config set -e cd_image_azure # cd_image_cb cd_image_gcp"
        env:
          cd_image_azure: ${{ env.IMAGE_REPO }}@${{ steps.build-push.outputs.digest }}
          # cd_image_cb: ${{ env.IMAGE_REPO }}@${{ steps.build-push.outputs.digest }}
          # cd_image_gcp: ${{ env.IMAGE_REPO }}@${{ steps.build-push.outputs.digest }}

  ci:
    name: ci
    if: always() && github.event_name == 'pull_request'
    needs: [test, build_sdks, regen, build_image]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require provider tests, SDK builds, regeneration and image build
        env:
          TEST: ${{ needs.test.result }}
          SDKS: ${{ needs.build_sdks.result }}
          REGEN: ${{ needs.regen.result }}
          IMAGE: ${{ needs.build_image.result }}
        run: |
          for result in "$TEST" "$SDKS" "$REGEN" "$IMAGE"; do
            test "$result" = success || exit 1
          done
