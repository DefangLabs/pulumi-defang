# What a CLI before the model contract (DefangLabs/defang 24d233cc,
# compose/fixup.go configureAccessGateway) uploads for the compose.yaml next
# to this file on AWS (with `model: chat-default`: older CLIs did not resolve
# the `ai/` spelling): the CLI resolved the models itself, wrote them into the
# gateway command, and gave applications the provider-prefixed ID.
name: modeldemo
services:
  app:
    depends_on:
      chat: {condition: service_started, required: true}
      embed: {condition: service_started, required: true}
    environment:
      CHAT_MODEL: bedrock/us.amazon.nova-2-lite-v1:0
      CHAT_URL: https://proxy.example/v1/
      EMBED_BASE_URL: http://embed:4000/v1/
      EMBED_MODEL_NAME: bedrock/amazon.titan-embed-text-v2:0
      OPENAI_API_KEY: networkisalreadyprivate
    image: app
    networks: {default: null, model_provider_private: null}
  chat:
    command: [--drop_params, --model, bedrock/us.amazon.nova-2-lite-v1:0, --alias, chat-default]
    deploy: {resources: {reservations: {cpus: 0.5, memory: "2147483648"}}}
    environment: {AWS_REGION: us-west-2, LITELLM_MASTER_KEY: networkisalreadyprivate}
    image: litellm/litellm:v1.92.0
    networks: {model_provider_private: null}
    ports: [{mode: host, target: 4000, protocol: tcp}]
    x-defang-llm: true
  embed:
    command: [--drop_params, --model, bedrock/amazon.titan-embed-text-v2:0, --alias, embedding-default]
    deploy: {resources: {reservations: {cpus: 0.5, memory: "2147483648"}}}
    environment: {AWS_REGION: us-west-2, LITELLM_MASTER_KEY: networkisalreadyprivate}
    image: litellm/litellm:v1.92.0
    networks: {model_provider_private: null}
    ports: [{mode: host, target: 4000, protocol: tcp}]
    x-defang-llm: true
  custom:
    # A user-managed gateway that only asks for model access: never rewritten.
    command: [--config, /app/litellm.yaml]
    image: litellm/litellm:v1.92.0
    ports: [{mode: host, target: 4000, protocol: tcp}]
    x-defang-llm: {}
networks:
  default: {name: modeldemo_default}
  model_provider_private: {name: model_provider_private}
models:
  chat:
    model: chat-default
  embed:
    model: embedding-default
